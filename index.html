<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maya Chen — Product Designer & Frontend Developer</title>
  <meta name="description" content="Portfolio of Maya Chen, a product designer and frontend developer crafting calm, usable interfaces." />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%236c7bff'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/portfolio.css" />
  <link rel="stylesheet" href="/css/editor.css" />
</head>
<body>
  <div class="bg-fx" id="bgFx" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span><span class="gridlay"></span><span class="grain"></span></div>

  <a class="skip" href="#main">Skip to content</a>

  <header class="nav" id="siteNav">
    <div class="wrap nav-inner">
      <a class="brand" href="#top" id="brandLink"><span class="brand-dot" id="brandDot">●</span><span id="brandName">Maya Chen</span></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary"></nav>
      <div class="nav-actions">
        <button class="icon-btn" id="appearanceToggle" type="button" aria-label="Toggle light and dark appearance" title="Toggle appearance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.9 4.9 1.4 1.4" /> <path d="m17.7 17.7 1.4 1.4" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.3 17.7-1.4 1.4" /> <path d="m19.1 4.9-1.4 1.4" /></svg></button>
        <button class="nav-cta" id="navCta" type="button">Get in touch</button>
        <button class="icon-btn nav-menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12" /> <line x1="4" x2="20" y1="6" y2="6" /> <line x1="4" x2="20" y1="18" y2="18" /></svg></button>
      </div>
    </div>
    <div class="wrap mobile-menu" id="mobileMenu" hidden></div>
  </header>

  <main id="main">
    <div class="wrap" id="portfolioRoot">
      <section class="hero" id="hero">
        <div class="hero-text">
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 id="heroTitle"></h1>
          <p class="lede" id="heroSubtitle"></p>
          <div class="hero-ctas">
            <a class="btn btn-primary" id="heroCtaPrimary" href="#projects">View work</a>
            <a class="btn btn-ghost" id="heroCtaSecondary" href="#contact">Get in touch</a>
          </div>
          <div class="socials" id="heroSocials"></div>
        </div>
        <div class="hero-media" id="heroMedia">
          <div class="portrait" id="portraitWrap"><span class="portrait-fallback" id="portraitFallback">MC</span><img id="portraitImg" alt="Portrait" hidden /></div>
        </div>
      </section>

      <div id="sectionsRoot"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p id="footerText"></p>
      <div class="socials small" id="footerSocials"></div>
      <button class="footer-dot" id="footerDot" type="button" aria-label="Site information" title="©">©</button>
    </div>
  </footer>

  <!-- Floating admin entry: hidden unless an admin session exists. -->
  <button id="adminFab" class="admin-fab" type="button" hidden aria-label="Open site editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></svg></button>

  <!-- Login dialog (hidden by default, opened via discreet entry points) -->
  <div class="login-backdrop" id="loginBackdrop" hidden>
    <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <button class="icon-btn login-close" id="loginClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
      <h2 id="loginTitle">Site owner sign in</h2>
      <p class="muted">Enter the admin password to open the visual editor. It stays on the server — never in page code.</p>
      <form id="loginForm">
        <label class="field"><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password" required /></label>
        <p class="form-error" id="loginError" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">Unlock editor</button>
      </form>
      <p class="muted tiny" id="loginHint">Protected by a server-side session cookie. <span id="serverConfigNote"></span></p>
    </div>
  </div>

  <!-- Visual editor shell (populated by js/editor/*) -->
  <div id="editorRoot" hidden></div>

  <script src="/js/config-default.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/render.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/editor/controls.js" defer></script>
  <script src="/js/editor/editor-state.js" defer></script>
  <script src="/js/editor/panels.js" defer></script>
  <script src="/js/editor/editor.js" defer></script>
</body>
</html>
